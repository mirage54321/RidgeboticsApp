  <!-- Pre-boot loading screen styles: this is plain CSS, not Flutter, so it
       can paint before the Flutter engine has even started downloading. -->
  <style>
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: opacity 300ms ease-out;
      opacity: 1;
      z-index: 9999;
    }
    #loading.loading-hide {
      opacity: 0;
      pointer-events: none;
    }
    #loading .loading-wordmark {
      font-size: 28px;
      font-weight: 500;
      color: #000000;
    }
    #loading .loading-wordmark .letter-l { color: #CF2879; }
    #loading .loading-wordmark .letter-e { color: #00B3AC; }
    #loading .loading-wordmark .letter-n { color: #FFC107; }
    #loading .loading-wordmark .letter-s { color: #FFA007; }
    #loading .loading-spinner {
      margin-top: 28px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid rgba(0, 0, 0, 0.08);
      border-top-color: #CF2879;
      animation:
        loading-spin 0.9s linear infinite,
        loading-color-cycle 3.2s ease-in-out infinite;
    }
    @keyframes loading-spin {
      to { transform: rotate(360deg); }
    }
    /* Cycles the spinner's colored arc through the same four colors as the
       l/e/n/s letters, in the same order, looping back to pink at the end. */
    @keyframes loading-color-cycle {
      0% { border-top-color: #CF2879; }
      25% { border-top-color: #00B3AC; }
      50% { border-top-color: #FFC107; }
      75% { border-top-color: #FFA007; }
      100% { border-top-color: #CF2879; }
    }
  </style>
</head>
<body>
  <!-- Shown immediately on page load, removed once Flutter paints its first
       frame (see the flutter-first-frame listener below). This is what you
       actually see during the white/blank flash before Flutter boots. -->
  <div id="loading">
    <div class="loading-wordmark">robo<span class="letter-l">l</span><span class="letter-e">e</span><span class="letter-n">n</span><span class="letter-s">s</span></div>
    <div class="loading-spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loadingEl = document.getElementById('loading');
      if (!loadingEl) return;
      loadingEl.classList.add('loading-hide');
      setTimeout(function () { loadingEl.remove(); }, 300);
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
